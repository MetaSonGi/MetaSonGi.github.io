<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>알록달록 블록 놀이터 · MetaSonGi</title><link rel="stylesheet" href="blocks.css?v=20261116025837">
</head><body>
<header class="top"><div><h1>🧩 블록 놀이터</h1><p>통로와 벽을 놓고, 로봇이 부품을 도착지로 옮기게 만들어 보세요.</p></div><div class="top-actions"><button id="automation">🤖 운반 예제</button><button id="example">반복 예제</button><button id="undo" disabled>↶ 되돌리기</button><button id="save">💾 저장</button><button id="load">📂 열기</button><input id="file" type="file" accept=".json,application/json" hidden></div></header>
<nav class="mobile-nav" aria-label="실습 화면 바로가기"><a href="#simulation">3D 실행</a><a href="#floor-heading">바닥 배치</a><a href="#blocks">블록 만들기</a></nav>
<main class="studio">
<aside class="preview panel" id="simulation">
<div class="section-head"><h2>3D 실습</h2><span id="engine" class="engine">불러오는 중</span></div>
<div class="stage"><canvas id="unity-canvas" width="600" height="420" tabindex="0" aria-label="Unity 자동화 실습 화면"></canvas><div id="loading"><strong>3D 실습 준비 중…</strong><progress id="progress" max="1" value="0"></progress><span id="load-status">잠시만 기다려 주세요</span></div></div><div class="controls"><button id="run" class="run" disabled>▶ 처음부터 실행</button><button id="stop" disabled>■ 정지</button><button id="reset" disabled>↺ 제자리</button></div><div id="status" class="status" role="status">블록을 만들고 실행해 보세요.</div>
<section class="floor-editor" aria-labelledby="floor-heading"><div class="section-head"><h2 id="floor-heading">바닥 배치</h2><button id="floor-edit" class="subtle" hidden>배치 편집</button></div>
<div class="scene-tools"><button id="floor-clear">바닥 초기화</button><p>도구를 고른 뒤 칸을 누르세요. 위쪽이 앞입니다.</p><div id="floor-tools" aria-label="배치 도구"><button data-tool="road">통로</button><button data-tool="wall">벽</button><button data-tool="goal">🏁 도착</button><button data-tool="robot">🤖 로봇</button><button data-tool="cube">📦 부품</button><button data-tool="sphere">⚪ 공</button><button data-tool="floor">지우기</button></div><p id="map-mode">시작 배치 · 한 칸 1.6m</p><div id="floor-map" aria-label="바닥 지도"></div><p id="objects"></p></div>
</section>
</aside>
<aside class="palette panel" id="blocks"><h2>블록 추가</h2><p>눌러 추가하거나 작업판에 끌어 놓으세요.</p><div id="palette"></div></aside>
<section class="workspace panel"><div class="section-head"><div><h2>블록 작업판</h2><p id="block-count">블록 0개</p></div><button id="clear" class="subtle">비우기</button></div><div id="workspace" aria-label="블록 작업판"><div class="start-hat">🚩 시작하면</div><div id="program"></div></div><div id="selection" role="status">블록 순서는 드래그하거나 ↑ ↓로 바꿀 수 있어요.</div></section>
</main><div id="toast" role="status"></div>
